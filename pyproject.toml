[project]
name = "algo"
version = "0.0.1"
description = "Trading algorithm R&D for Indian equity markets via Zerodha"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "requests>=2.32",
    "python-dateutil>=2.9",
    "pytz>=2024.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
backtest = [
    "vectorbt>=0.26",
    "matplotlib>=3.8",
    "plotly>=5.20",
]
research = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "seaborn>=0.13",
]
live = [
    "kiteconnect>=5.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "PD"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
